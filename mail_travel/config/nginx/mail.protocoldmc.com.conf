# Roundcube webmail — mail.protocoldmc.com
server {
    listen 80;
    listen [::]:80;
    server_name mail.protocoldmc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.protocoldmc.com;

    ssl_certificate     /etc/letsencrypt/live/mail.protocoldmc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.protocoldmc.com/privkey.pem;

    # Roundcube 1.7 docroot = public_html (maxfiy papkalar yuqorida, kirib bo'lmaydi)
    root /var/www/roundcube/public_html;
    index index.php;

    client_max_body_size 50M;

    location ~ /\. { deny all; }
    location ~ ^/installer { deny all; }

    location = /favicon.ico {
        try_files $uri /static.php/skins/elastic/images/favicon.ico;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # .php va static.php/... (PATH_INFO) uchun
    location ~ \.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    access_log /var/log/nginx/roundcube_access.log;
    error_log  /var/log/nginx/roundcube_error.log;
}
